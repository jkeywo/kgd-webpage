<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwi Game Design</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1><img src="images/KGDLogo.avif" height="64px" />Kiwi Game Design</h1>
</header>

<main id="homeView">
    <div class="content">
        <section id="megagames"><h2>Megagames</h2><div class="grid"></div></section>
        <section id="boardgames"><h2>Boardgames</h2><div class="grid"></div></section>
        <section id="roleplaying"><h2>Roleplaying Games</h2><div class="grid"></div></section>
        <section id="other"><h2>Other Games</h2><div class="grid"></div></section>
    </div>
</main>

<main id="gameView" class="hidden">
    <div class="content" id="gameContent"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="script.js"></script>
</body>
</html>
